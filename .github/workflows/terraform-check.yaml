name: terraform-check
on:
  workflow_call:
    inputs:
      workspaces:
        description: JSON list of Terraform directories, e.g. '["zero-trust/tunnel"]'
        type: string
        required: true
      terraform-version:
        type: string
        default: 1.16.5

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init
        env:
          WORKSPACES: ${{ inputs.workspaces }}
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$WORKSPACES" | while IFS= read -r ws; do
            echo "::group::$ws"
            terraform -chdir="$ws" init -backend=false -no-color
            echo "::endgroup::"
          done
      - name: validate
        env:
          WORKSPACES: ${{ inputs.workspaces }}
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$WORKSPACES" | while IFS= read -r ws; do
            echo "::group::$ws"
            terraform -chdir="$ws" validate -no-color
            echo "::endgroup::"
          done
      - name: test (mocked providers)
        env:
          WORKSPACES: ${{ inputs.workspaces }}
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$WORKSPACES" | while IFS= read -r ws; do
            echo "::group::$ws"
            terraform -chdir="$ws" test -no-color
            echo "::endgroup::"
          done
