name: terraform-check
on:
  workflow_call:
    inputs:
      workspaces:
        description: JSON list of Terraform directories, e.g. '["zero-trust/tunnel"]'
        type: string
        required: true
      terraform-version:
        type: string
        default: 1.16.5

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init, validate, test
        env:
          WORKSPACES: ${{ inputs.workspaces }}
        run: |
          set -euo pipefail
          failed=()
          while IFS= read -r ws; do
            echo "::group::$ws"
            if terraform -chdir="$ws" init -backend=false -no-color \
              && terraform -chdir="$ws" validate -no-color \
              && terraform -chdir="$ws" test -no-color; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$ws failed"
              failed+=("$ws")
            fi
          done < <(jq -r '.[]' <<< "$WORKSPACES")
          [[ ${#failed[@]} -eq 0 ]]
