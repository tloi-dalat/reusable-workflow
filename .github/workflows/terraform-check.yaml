name: terraform-check
on:
  workflow_call:
    inputs:
      workspaces:
        description: JSON list of Terraform directories, e.g. '["zero-trust/tunnel"]'
        type: string
        required: true
      terraform-version:
        type: string
        default: 1.16.5

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(inputs.workspaces) }}
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init
        run: terraform init -backend=false -no-color
      - name: validate
        run: terraform validate -no-color
      - name: test (mocked providers)
        run: terraform test -no-color
