name: dispatch
on:
  workflow_call:
    inputs:
      apps:
        description: Comma-separated app directories, e.g. site,bridge,celery
        type: string
        required: true
      namespace:
        type: string
        required: true
      environment:
        description: development | production
        type: string
        required: true
      version:
        type: string
        required: true
      digest:
        description: Optional manifest digest to pin alongside the tag (production)
        type: string
        default: ''
    secrets:
      CI_APP_ID:
        required: true
      CI_APP_PRIVATE_KEY:
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: control-plane
          permission-contents: write

      - name: Send sync-version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ github.repository_owner }}/control-plane
          APPS: ${{ inputs.apps }}
          NAMESPACE: ${{ inputs.namespace }}
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.digest }}
          ACTOR: ${{ github.actor }}
          SOURCE: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg apps "$APPS" --arg namespace "$NAMESPACE" --arg environment "$ENVIRONMENT" \
            --arg version "$VERSION" --arg digest "$DIGEST" \
            --arg actor "$ACTOR" --arg source "$SOURCE" --arg sha "$SHA" \
            '{event_type: "sync-version",
              client_payload: {apps: $apps, namespace: $namespace, environment: $environment,
                               version: $version, digest: $digest,
                               actor: $actor, source: $source, sha: $sha}}' \
          | gh api "repos/${TARGET}/dispatches" --input -
          echo "Requested ${ENVIRONMENT}/${NAMESPACE}/{${APPS}} → ${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"
