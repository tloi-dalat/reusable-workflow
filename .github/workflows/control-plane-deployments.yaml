name: control-plane-deployments
on:
  workflow_call:
    inputs:
      after:
        description: Commit to record (full SHA)
        type: string
        required: true
      before:
        description: Commit before the change; empty or unknown = the parent of `after`
        type: string
        default: ''
    secrets:
      CI_APP_ID:
        required: true
      CI_APP_PRIVATE_KEY:
        required: true

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-deployments: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.after }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record deployments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after }}
          SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::after must be a full SHA: $AFTER"; exit 1; }
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2> /dev/null; then
            BEFORE="${AFTER}^"
          fi

          declare -A groups=()
          declare -A urls=()
          while IFS= read -r f; do
            [[ "$f" =~ ^clusters/([a-z0-9-]+)/([a-z0-9-]+)/([a-z0-9-]+)/values\.yaml$ ]] || continue
            env=${BASH_REMATCH[1]} ns=${BASH_REMATCH[2]} app=${BASH_REMATCH[3]}
            [[ -f "$f" ]] || continue
            image=$(yq '.image.repository // ""' "$f")
            tag=$(yq '.image.tag // ""' "$f")
            old=$( { git show "${BEFORE}:${f}" 2> /dev/null || true; } | yq '.image.tag // ""')
            [[ -n "$image" && -n "$tag" && "$tag" != "$old" ]] || continue

            if ! labels=$(skopeo inspect --no-tags \
                  --format '{{index .Labels "org.opencontainers.image.source"}} {{index .Labels "org.opencontainers.image.revision"}}' \
                  "docker://${image}:${tag}" 2> /dev/null); then
              echo "::warning file=${f}::cannot inspect ${image}:${tag}; no deployment recorded for ${ns}/${app}"
              continue
            fi
            read -r source revision _ <<< "$labels"
            [[ "${source,,}" == "${SERVER,,}/${OWNER,,}/"* && "$revision" =~ ^[0-9a-f]{40}$ ]] || continue
            key="${source#"$SERVER/"}|${revision}|${env}|${tag}"
            groups[$key]="${groups[$key]:+${groups[$key]}, }${ns}/${app}"

            if [[ -z "${urls[$key]:-}" ]]; then
              url=$(yq '.url // ""' "$f")
              domain=$(yq '.env.SITE__DOMAIN // ""' "$f")
              if [[ -z "$url" && "$domain" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$ ]]; then
                url="https://${domain}"
              fi
              [[ "$url" =~ ^https?://[^[:space:]]+$ ]] && urls[$key]=$url
            fi
          done < <(git diff --name-only "$BEFORE" "$AFTER" -- 'clusters/*/*/*/values.yaml')

          if (( ${#groups[@]} == 0 )); then
            echo "No image changes from this org's repos in ${BEFORE::12}..${AFTER::7}."
            exit 0
          fi

          failed=0
          for key in "${!groups[@]}"; do
            IFS='|' read -r target revision env tag <<< "$key"
            apps=${groups[$key]}
            description="${apps} → ${tag}"
            if ! id=$(jq -n --arg ref "$revision" --arg env "$env" --arg desc "${description:0:140}" \
                         --arg cp "${REPO}@${AFTER}" --arg tag "$tag" \
                         '{ref: $ref, environment: $env, description: $desc,
                           auto_merge: false, required_contexts: [],
                           production_environment: ($env == "production"),
                           payload: {version: $tag, control_plane: $cp}}' \
                      | gh api "repos/${target}/deployments" --input - --jq .id); then
              echo "::error::could not create a ${env} deployment in ${target} (is the CI App installed there, with Deployments: write?)"
              failed=1; continue
            fi
            if ! jq -n --arg log "${SERVER}/${REPO}/commit/${AFTER}" --arg url "${urls[$key]:-}" \
                    '{state: "success", log_url: $log, auto_inactive: true,
                      description: "On control-plane main; ArgoCD applies it within minutes"}
                     + (if $url != "" then {environment_url: $url} else {} end)' \
                 | gh api "repos/${target}/deployments/${id}/statuses" --input - > /dev/null; then
              echo "::error::could not set the status of deployment ${id} in ${target}"
              failed=1; continue
            fi
            echo "- \`${target}\` **${env}** ← \`${tag}\` (${apps}) @ ${revision::7}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
