# After a release tag is built, say how to deploy it — in the run summary AND in
# the GitHub Release for the tag (Releases tab):
#   - the images built from the tag (when `images` is given)
#   - one `image:` block per app, ready to paste into
#     clusters/<environment>/<namespace>/<app>/values.yaml in control-plane
#
# Production is deployed by a reviewed PR, never by CI. This only tells the
# person writing that PR exactly what to change. Call it from the tag build,
# after the images are pushed. A tag pushed by hand has no Release yet; one is
# created (notes generated from the previous tag).
#
# Caller needs:  permissions: { contents: write }   (to edit the Release)
name: production-values
on:
  workflow_call:
    inputs:
      version:
        description: The release tag that was built (X.Y.Z)
        type: string
        required: true
      namespace:
        type: string
        required: true
      apps:
        description: Comma-separated app directories that move together, e.g. core,wsevent
        type: string
        required: true
      images:
        description: Comma-separated image names built from the tag, e.g. oj-core,oj-wsevent (listed in the Release)
        type: string
        default: ''
      environment:
        type: string
        default: production

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Summary and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NAMESPACE: ${{ inputs.namespace }}
          APPS: ${{ inputs.apps }}
          IMAGES: ${{ inputs.images }}
          ENVIRONMENT: ${{ inputs.environment }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Same rules control-plane's receiver applies to paths and tags.
          [[ "$APPS"        =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]  || { echo "::error::bad apps: $APPS"; exit 1; }
          [[ -z "$IMAGES" || "$IMAGES" =~ ^[a-z0-9._-]+(,[a-z0-9._-]+)*$ ]] || { echo "::error::bad images: $IMAGES"; exit 1; }
          [[ "$NAMESPACE"   =~ ^[a-z0-9-]+$ ]]                || { echo "::error::bad namespace: $NAMESPACE"; exit 1; }
          [[ "$ENVIRONMENT" =~ ^[a-z0-9-]+$ ]]                || { echo "::error::bad environment: $ENVIRONMENT"; exit 1; }
          [[ "$VERSION"     =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]    || { echo "::error::not a release tag: $VERSION"; exit 1; }

          IFS=',' read -ra app_list <<< "$APPS"
          IFS=',' read -ra image_list <<< "$IMAGES"
          fence='```'
          {
            if (( ${#image_list[@]} > 0 )); then
              echo "### Images"
              for image in "${image_list[@]}"; do
                echo "- \`ghcr.io/${OWNER,,}/${image}:${VERSION}\`"
              done
              echo ""
            fi
            echo "### Deploy ${VERSION} to ${ENVIRONMENT}"
            if (( ${#app_list[@]} > 1 )); then
              echo "PR to ${OWNER}/control-plane, all files in the same PR:"
            else
              echo "PR to ${OWNER}/control-plane:"
            fi
            for app in "${app_list[@]}"; do
              echo ""
              echo "\`clusters/${ENVIRONMENT}/${NAMESPACE}/${app}/values.yaml\`"
              echo "${fence}yaml"
              echo "image:"
              echo "  tag: ${VERSION}"
              echo "${fence}"
            done
          } > section.md
          cat section.md >> "$GITHUB_STEP_SUMMARY"

          # Releases tab. The section sits under a marker, so a re-run replaces
          # it instead of appending a second copy.
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          marker='<!-- production-values -->'
          body=$(gh release view "$VERSION" --json body --jq .body)
          body=${body%%"$marker"*}
          body=$(printf '%s' "$body")   # drop trailing blank lines, so re-runs don't add more
          {
            printf '%s\n\n%s\n' "$body" "$marker"
            cat section.md
          } > notes.md
          gh release edit "$VERSION" --notes-file notes.md
