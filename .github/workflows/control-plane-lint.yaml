name: control-plane-lint
on:
  workflow_call:
    inputs:
      kubernetes-version:
        description: Schema version to validate against (match the cluster)
        type: string
        default: 1.36.0
      kustomize-version:
        type: string
        default: v5.8.2
      kubeconform-version:
        type: string
        default: v0.8.0
      helm-version:
        type: string
        default: v4.3.0
      allow-plaintext-keys:
        description: Space-separated env keys that look secret but aren't (e.g. OAuth client IDs)
        type: string
        default: SOCIAL__GOOGLE_KEY

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v5
        with:
          version: ${{ inputs.helm-version }}

      - name: Install kustomize and kubeconform
        env:
          KUSTOMIZE_VERSION: ${{ inputs.kustomize-version }}
          KUBECONFORM_VERSION: ${{ inputs.kubeconform-version }}
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kustomize/kustomize/v5@${KUSTOMIZE_VERSION}"
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: No plaintext secrets in values.yaml
        env:
          ALLOW: ${{ inputs.allow-plaintext-keys }}
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            while IFS= read -r key; do
              [[ -z "$key" ]] && continue
              if [[ " $ALLOW " == *" $key "* ]]; then continue; fi
              echo "::error file=${f}::env ${key} looks like a secret but has a literal value — put it in Infisical (envFrom / secretKeyRef)"
              bad=1
            done < <(yq '(.env // {}) | to_entries | .[]
                         | select(.key | test("(PASSWORD|SECRET|TOKEN|_KEY)$"))
                         | select(.value | type == "!!str")
                         | .key' "$f")
          done < <(find clusters -name values.yaml)
          exit $bad

      - name: Build every app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build"
          : > "$RUNNER_TEMP/failures.tsv"
          while IFS= read -r k; do
            dir=$(dirname "$k")
            out="$RUNNER_TEMP/build/${dir//\//__}.yaml"
            if ! kustomize build --enable-helm "$dir" > "$out" 2> "$RUNNER_TEMP/err.txt"; then
              msg=$(grep -m1 -i 'error' "$RUNNER_TEMP/err.txt" || head -n1 "$RUNNER_TEMP/err.txt")
              printf '%s\t%s\t%s\n' "$dir" "kustomize build" "$msg" >> "$RUNNER_TEMP/failures.tsv"
              rm -f "$out"
            fi
          done < <(find clusters -name kustomization.yaml | sort)
          echo "Built $(find "$RUNNER_TEMP/build" -name '*.yaml' | wc -l) apps"

      - name: Schemas from the CRDs we deploy
        env:
          KUBECONFORM_VERSION: ${{ inputs.kubeconform-version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/schemas"
          cd "$RUNNER_TEMP/schemas"
          python3 -c 'import yaml' 2> /dev/null || pip install --quiet pyyaml
          curl -sfL "https://raw.githubusercontent.com/yannh/kubeconform/${KUBECONFORM_VERSION}/scripts/openapi2jsonschema.py" -o "$RUNNER_TEMP/openapi2jsonschema.py"
          shopt -s nullglob
          builds=("$RUNNER_TEMP"/build/*.yaml)
          if (( ${#builds[@]} > 0 )); then
            FILENAME_FORMAT='{fullgroup}-{kind}_{version}' python3 "$RUNNER_TEMP/openapi2jsonschema.py" "${builds[@]}" > /dev/null
          fi
          echo "Generated $(ls | wc -l) schemas"

      - name: Validate every app
        env:
          K8S_VERSION: ${{ inputs.kubernetes-version }}
        run: |
          set -euo pipefail
          own="$RUNNER_TEMP/schemas/{{.Group}}-{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          catalog='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          validate() {
            kubeconform -strict -skip CustomResourceDefinition -kubernetes-version "$K8S_VERSION" -output json \
              -schema-location default -schema-location "$own" -schema-location "$catalog" "$2" > "$RUNNER_TEMP/result.json" || true
            jq -r --arg dir "$1" '.resources[]? | select(.status == "statusInvalid" or .status == "statusError")
              | [$dir, "\(.kind) \(.name)", (.msg | gsub("[\t\n]"; " "))] | @tsv' "$RUNNER_TEMP/result.json" >> "$RUNNER_TEMP/failures.tsv" \
              || printf '%s\t%s\t%s\n' "$1" "kubeconform" "could not validate the rendered manifests" >> "$RUNNER_TEMP/failures.tsv"
          }
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/build/*.yaml; do
            name=$(basename "$f" .yaml)
            validate "${name//__//}" "$f"
          done
          for f in clusters/*/application-set.yaml; do
            validate "$f" "$f"
          done

      - name: Every image exists
        env:
          IMAGES: >-
            select(.kind != "CustomResourceDefinition" and .kind != "ConfigMap" and .kind != "Secret")
            | .. | select(tag == "!!map") | (.image, .imageName, .image.reference?)
            | select(tag == "!!str" and test("^[^\\s]+$"))
        run: |
          set -euo pipefail
          declare -A checked=()
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/build/*.yaml; do
            name=$(basename "$f" .yaml)
            dir=${name//__//}
            while IFS= read -r img; do
              [[ -z "$img" || "$img" == "null" ]] && continue
              if [[ -z "${checked[$img]:-}" ]]; then
                if skopeo inspect --raw "docker://${img}" > /dev/null 2>&1; then checked[$img]=ok; else checked[$img]=missing; fi
              fi
              if [[ "${checked[$img]}" == missing ]]; then
                printf '%s\t%s\t%s\n' "$dir" "image" "${img} not found or not public" >> "$RUNNER_TEMP/failures.tsv"
              fi
            done < <(yq ea -N "$IMAGES" "$f" | sort -u)
          done
          echo "Checked ${#checked[@]} images"

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/failures.tsv"
          if [[ ! -s "$f" ]]; then
            echo "### Every app builds, validates and has its images" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### $(cut -f1 "$f" | sort -u | wc -l) app(s) failed"
            echo
            echo "| App | What | Problem |"
            echo "|---|---|---|"
            sort -u "$f" | while IFS=$'\t' read -r dir what msg; do
              printf '| `%s` | %s | %s |\n' "$dir" "$what" "${msg//|/\\|}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          sort -u "$f" | while IFS=$'\t' read -r dir what msg; do
            file="$dir/kustomization.yaml"
            [[ -f "$file" ]] || file="$dir"
            echo "::error file=${file},title=${dir}: ${what}::${msg}"
          done
          exit 1
