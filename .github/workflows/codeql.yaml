name: codeql
on:
  workflow_call:
    inputs:
      languages:
        description: JSON list of CodeQL languages (python, javascript-typescript, actions, ...)
        type: string
        default: '["python", "javascript-typescript", "actions"]'
      queries:
        description: Query suite (default | security-extended | security-and-quality)
        type: string
        default: security-extended
      paths-ignore:
        description: Paths not to analyse, one per line (directories or globs, relative to the repo root)
        type: string
        default: ''

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build CodeQL config
        id: config
        env:
          QUERIES: ${{ inputs.queries }}
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          paths = [line.strip() for line in os.environ['PATHS_IGNORE'].splitlines() if line.strip()]
          config = {'queries': [{'uses': os.environ['QUERIES']}]}
          if paths:
              config['paths-ignore'] = paths
          print(json.dumps(config, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('config=%s\n' % json.dumps(config))
          PY

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config: ${{ steps.config.outputs.config }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
