name: node-build-check
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24.x'
      build:
        description: Build command, run after npm ci
        type: string
        default: npm run build

jobs:
  check:
    name: node
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build
        env:
          BUILD: ${{ inputs.build }}
        run: bash -c "$BUILD"
