name: django-test-check
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      requirements:
        description: Space-separated requirement files
        type: string
        default: requirements.txt
      settings-file:
        description: CI settings copied over settings-target before running
        type: string
        default: .ci.settings.py
      settings-target:
        type: string
        default: dmoj/local_settings.py
      mysql-image:
        description: MySQL or MariaDB image; match production (Django 6 needs MySQL 8.4+ / MariaDB 10.6+)
        type: string
        default: mysql:8.4
      setup:
        description: Commands to run before the tests, one per line
        type: string
        default: ''
      labels:
        description: Space-separated test labels passed to manage.py test; empty runs every test
        type: string
        default: ''

jobs:
  check:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: ${{ inputs.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dmoj
        ports:
          - 13306:3306
        options: --health-cmd="mysqladmin ping || mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -euo pipefail
          pip install wheel
          for r in $REQUIREMENTS; do pip install -r "$r"; done

      - name: Install CI settings
        env:
          SRC: ${{ inputs.settings-file }}
          DST: ${{ inputs.settings-target }}
        run: cp "$SRC" "$DST"

      - name: Set up
        if: inputs.setup != ''
        env:
          COMMANDS: ${{ inputs.setup }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [[ -z "${cmd// }" ]] && continue
            echo "::group::${cmd}"
            bash -c "$cmd"
            echo "::endgroup::"
          done <<< "$COMMANDS"

      - name: Tests
        env:
          LABELS: ${{ inputs.labels }}
        run: |
          set -euo pipefail
          read -ra labels <<< "$LABELS"
          python manage.py test --noinput "${labels[@]}"
