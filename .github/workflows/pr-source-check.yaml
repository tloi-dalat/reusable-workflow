name: pr-source-check
on:
  workflow_call:
    inputs:
      base:
        description: Base branch this rule protects
        type: string
        default: release
      head:
        description: The only branch (of this repository) allowed to merge into `base`
        type: string
        default: main

jobs:
  source:
    name: source
    if: github.event_name == 'pull_request' && github.base_ref == inputs.base
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Only ${{ inputs.head }} can be merged into ${{ inputs.base }}
        env:
          BASE: ${{ inputs.base }}
          ALLOWED: ${{ inputs.head }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != "$ALLOWED" || "$HEAD_REPO" != "$REPO" ]]; then
            echo "::error::Only ${REPO}:${ALLOWED} can be merged into ${BASE} (got ${HEAD_REPO}:${HEAD_REF})."
            exit 1
          fi
          echo "${HEAD_REPO}:${HEAD_REF} → ${BASE}: allowed"
