name: workflow-lint
on:
  workflow_call:
    inputs:
      actionlint-version:
        type: string
        default: v1.7.12

jobs:
  check:
    name: workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@${VERSION}"
          "$(go env GOPATH)/bin/actionlint" -color
