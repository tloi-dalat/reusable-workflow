# Review gate for Django schema changes on pull requests:
#   - fails when models changed without a migration (makemigrations --check)
#   - writes the SQL of every NEW migration file into the job summary, so a
#     reviewer reads the actual ALTER TABLE instead of a Python file
#
# MySQL has no transactional DDL: a migration that fails halfway stays half
# applied. Reading the SQL before merge is the cheapest protection there is.
#
# Caller needs:  permissions: { contents: read }
name: django-migration-check
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      requirements:
        description: Space-separated requirement files
        type: string
        default: requirements.txt
      settings-file:
        description: CI settings copied over settings-target before running
        type: string
        default: .ci.settings.py
      settings-target:
        type: string
        default: dmoj/local_settings.py
      mysql-image:
        type: string
        default: mysql:8.0

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: ${{ inputs.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dmoj
        ports:
          - 13306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -euo pipefail
          pip install wheel
          for r in $REQUIREMENTS; do pip install -r "$r"; done

      - name: Install CI settings
        env:
          SRC: ${{ inputs.settings-file }}
          DST: ${{ inputs.settings-target }}
        run: cp "$SRC" "$DST"

      - name: Models and migrations agree
        run: python manage.py makemigrations --check --dry-run

      - name: SQL of new migrations
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mapfile -t added < <(git diff --diff-filter=A --name-only "origin/${BASE}...HEAD" -- '*/migrations/[0-9]*.py')
          if [[ ${#added[@]} -eq 0 ]]; then
            echo "No new migrations in this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # sqlmigrate introspects existing tables for some operations (e.g. RemoveField on
          # MySQL), so the database must first be at the base branch's schema: hide the new
          # migration files, migrate, then put them back.
          held=$(mktemp -d)
          for f in "${added[@]}"; do
            mkdir -p "$held/$(dirname "$f")"
            mv "$f" "$held/$f"
          done
          python manage.py migrate --noinput > /dev/null
          for f in "${added[@]}"; do
            mv "$held/$f" "$f"
          done

          # Only the new migrations are unapplied now; list them in dependency order.
          mapfile -t pending < <(python manage.py showmigrations --plan | awk '$1 == "[" && $2 == "]" { print $3 }')

          {
            echo "## SQL this PR will run on deploy"
            echo "MySQL DDL is not transactional — a failure part-way leaves the schema half-changed."
          } >> "$GITHUB_STEP_SUMMARY"
          for m in "${pending[@]}"; do
            app=${m%%.*}
            name=${m#*.}
            {
              echo "### ${app} / ${name}"
              echo '```sql'
              python manage.py sqlmigrate "$app" "$name"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Apply it so the next migration's SQL is generated against the right schema.
            python manage.py migrate "$app" "$name" --noinput > /dev/null
          done
