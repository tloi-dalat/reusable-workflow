name: django-migration-check
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      requirements:
        description: Space-separated requirement files
        type: string
        default: requirements.txt
      settings-file:
        description: The repo's CI settings file (database, cache, ...), copied to settings-target before running
        type: string
        default: .ci.settings.py
      settings-target:
        description: Path the project's settings.py loads its local settings from, e.g. myproject/local_settings.py
        type: string
        required: true
      database:
        description: Database service to start, mysql (port 13306) or postgres (port 15432); user root, password root, database ci
        type: string
        default: mysql
      mysql-image:
        description: MySQL or MariaDB image; match production (Django 6 needs MySQL 8.4+ / MariaDB 10.6+)
        type: string
        default: mysql:8.4
      postgres-image:
        description: PostgreSQL image; match production (Django 6 needs PostgreSQL 15+)
        type: string
        default: postgres:17

jobs:
  check:
    name: migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: ${{ inputs.database == 'mysql' && inputs.mysql-image || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci
        ports:
          - 13306:3306
        options: --health-cmd="mysqladmin ping || mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: ${{ inputs.database == 'postgres' && inputs.postgres-image || '' }}
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ci
        ports:
          - 15432:5432
        options: --health-cmd="pg_isready -U root -d ci" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Check database input
        env:
          DATABASE: ${{ inputs.database }}
        run: |
          case "$DATABASE" in
            mysql|postgres) ;;
            *) echo "::error::database must be mysql or postgres, got '${DATABASE}'"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -euo pipefail
          pip install wheel
          for r in $REQUIREMENTS; do pip install -r "$r"; done

      - name: Install CI settings
        env:
          SRC: ${{ inputs.settings-file }}
          DST: ${{ inputs.settings-target }}
        run: cp "$SRC" "$DST"

      - name: Models and migrations agree
        run: python manage.py makemigrations --check --dry-run

      - name: SQL of new migrations
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          DATABASE: ${{ inputs.database }}
        run: |
          set -euo pipefail
          mapfile -t added < <(git diff --diff-filter=A --name-only "origin/${BASE}...HEAD" -- '*/migrations/[0-9]*.py')
          if [[ ${#added[@]} -eq 0 ]]; then
            echo "No new migrations in this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          held=$(mktemp -d)
          for f in "${added[@]}"; do
            mkdir -p "$held/$(dirname "$f")"
            mv "$f" "$held/$f"
          done
          python manage.py migrate --noinput > /dev/null
          for f in "${added[@]}"; do
            mv "$held/$f" "$f"
          done

          mapfile -t pending < <(python manage.py showmigrations --plan | awk '$1 == "[" && $2 == "]" { print $3 }')

          {
            echo "## SQL this PR will run on deploy"
            if [[ $DATABASE == mysql ]]; then
              echo "MySQL DDL is not transactional — a failure part-way leaves the schema half-changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for m in "${pending[@]}"; do
            app=${m%%.*}
            name=${m#*.}
            {
              echo "### ${app} / ${name}"
              echo '```sql'
              python manage.py sqlmigrate "$app" "$name"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python manage.py migrate "$app" "$name" --noinput > /dev/null
          done
