name: docker-build-check
on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON list of {"image": ..., "dockerfile": ..., "context": ..., "build-args": ...};
          "image" is the build-push.yaml image name (used for the cache scope), "context"
          defaults to ".", "build-args" is optional (newline-separated KEY=value, as in
          build-push.yaml)
        type: string
        required: true
      submodules:
        description: Passed to actions/checkout (false | true | recursive)
        type: string
        default: 'false'

jobs:
  build:
    name: build ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.image }}-linux-amd64

  check:
    name: docker
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$RESULT" != success ]]; then
            echo "::error::image build result: $RESULT"
            exit 1
          fi
          echo "All images build."
